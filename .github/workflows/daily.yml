name: Daily picks

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC (07:00 UK in summer, 06:00 UK in winter)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write             # needed so the job can commit docs/data.json

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build picks
        run: python build_data.py
      - name: Commit data.json
        run: |
          git config user.name "acca-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update picks $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
